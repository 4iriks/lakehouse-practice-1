spark.master local[4]
spark.driver.memory 3g
spark.sql.shuffle.partitions 8
spark.sql.adaptive.enabled true
spark.sql.session.timeZone UTC
spark.jars.packages org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.9.2,org.apache.iceberg:iceberg-aws-bundle:1.9.2
spark.sql.extensions org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.lake org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.lake.type rest
spark.sql.catalog.lake.uri http://lakekeeper:8181/catalog
spark.sql.catalog.lake.warehouse practice1
spark.sql.catalog.lake.io-impl org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.lake.s3.endpoint http://minio:9000
spark.sql.catalog.lake.s3.path-style-access true
spark.sql.catalog.lake.s3.access-key-id lab-admin
spark.sql.catalog.lake.s3.secret-access-key local-lab-minio-password
spark.sql.catalog.lake.client.region us-east-1
spark.sql.catalog.lake.rest.auth.type none
spark.ui.enabled false
