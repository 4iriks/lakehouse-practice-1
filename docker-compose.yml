name: lakehouse-practice-1
services:
  postgres:
    image: postgres:16.10-bookworm
    environment:
      POSTGRES_USER: lakekeeper
      POSTGRES_PASSWORD: local-lab-postgres
      POSTGRES_DB: lakekeeper
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lakekeeper -d lakekeeper"]
      interval: 3s
      timeout: 5s
      retries: 40
  minio:
    image: lakehouse-practice-1-minio:2025-09-07
    build: ./docker/minio
    environment:
      MINIO_ROOT_USER: lab-admin
      MINIO_ROOT_PASSWORD: local-lab-minio-password
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 5s
      retries: 40
  migrate:
    image: quay.io/lakekeeper/catalog:v0.9.5
    command: ["migrate"]
    environment: &lakekeeper_env
      LAKEKEEPER__PG_DATABASE_URL_READ: postgresql://lakekeeper:local-lab-postgres@postgres:5432/lakekeeper
      LAKEKEEPER__PG_DATABASE_URL_WRITE: postgresql://lakekeeper:local-lab-postgres@postgres:5432/lakekeeper
      LAKEKEEPER__PG_ENCRYPTION_KEY: local-lab-catalog-encryption-key
      LAKEKEEPER__AUTHZ_BACKEND: allowall
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
  lakekeeper:
    image: quay.io/lakekeeper/catalog:v0.9.5
    command: ["serve"]
    environment: *lakekeeper_env
    ports:
      - "127.0.0.1:8181:8181"
    mem_limit: 512m
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/home/nonroot/lakekeeper", "healthcheck"]
      interval: 3s
      timeout: 5s
      retries: 40
  trino:
    image: trinodb/trino:476
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./config/trino:/etc/trino:ro
    mem_limit: 4g
    cpus: 4
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/info"]
      interval: 3s
      timeout: 5s
      retries: 60
  spark:
    image: apache/spark:3.5.6
    profiles: ["spark"]
    user: "0:0"
    entrypoint: ["/opt/spark/bin/spark-submit"]
    command: ["/lab/scripts/spark_benchmark.py"]
    volumes:
      - ./:/lab
      - ./config/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ivy:/root/.ivy2
    working_dir: /lab
    mem_limit: 4g
    cpus: 4
volumes:
  pgdata:
  miniodata:
  ivy:
